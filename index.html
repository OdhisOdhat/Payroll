<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ADD FAVICON DATA URL HERE -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%232563eb'/></svg>">
  <title>PayrollPro Kenya - Advanced Enterprise Payroll</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    (function() {
      window.process = window.process || { env: {} };
      if (!window.process.env) window.process.env = {};
    })();
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      body {
        background-color: white;
      }
      #root {
        padding: 0 !important;
      }
    }
    :root {
      --primary-color: #2563eb;
      --primary-color-light: #eff6ff;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .custom-theme-bg { background-color: var(--primary-color); }
    .custom-theme-text { color: var(--primary-color); }
    .custom-theme-border { border-color: var(--primary-color); }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Entry: use src/index.tsx for React app -->
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
